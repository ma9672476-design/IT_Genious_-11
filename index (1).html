function test(i){S={i,k:0,ok:0,no:0,done:false};q()}
function q(){const c=D[S.i],n=c[1].length;if(S.k>=n){const p=P[S.i]||{};p.best=Math.max(p.best||0,S.ok);p.taken=1;P[S.i]=p;save();app.innerHTML=`<h2>Result · Ch ${S.i+1}</h2><div class="card"><div class="score">${S.ok} / ${n}</div><p style="text-align:center">Marks obtained: <b>${S.ok}</b> out of ${n}</p><p class="T">Correct: ${S.ok}</p><p class="F">Incorrect: ${S.no}</p></div><button class="btn" onclick="test(${S.i})">🔄 Restart Test</button><button class="btn alt" onclick="home()">Home</button><button class="btn alt" onclick="prep(${S.i})">Review answers</button>`;scrollTo(0,0);return}
const x=c[1][S.k];S.done=false;app.innerHTML=`<button class="back" onclick="list('t')">← Exit test</button><div class="ur">Question ${S.k+1} of ${n} · Tap the correct answer</div><div class="bar"><i style="width:${S.k/n*100}%"></i></div><div class="card"><b>${S.k+1}. ${e(x[0])}</b>${x[1].map((o,j)=>`<button class="opt" onclick="pick(${j})">${L[j]}) ${e(o)}</button>`).join("")}<div id="fb"></div></div><p>✔ ${S.ok} &nbsp; ✘ ${S.no}</p>`}
function pick(j){if(S.done)return;S.done=true;const x=D[S.i][1][S.k],o=document.querySelectorAll(".opt");o[x[2]].classList.add("ok");const r=j==x[2];if(r)S.ok++;else{S.no++;o[j].classList.add("no")}
document.getElementById("fb").innerHTML=`<div class="t ${r?"T":"F"}">${r?"TRUE ✔":"FALSE ✘"}</div><div class="ans">Correct answer: ${L[x[2]]}) ${e(x[1][x[2]])}</div><button class="btn" onclick="S.k++;q()">${S.k+1>=D[S.i][1].length?"See result":"Next question"}</button>`}
document.addEventListener("pointermove",e=>{const b=e.target.closest&&e.target.closest(".big");if(!b||e.pointerType!=="mouse")return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;b.style.transform="perspective(700px) rotateX("+(-y*8)+"deg) rotateY("+(x*10)+"deg)"});
document.addEventListener("pointerout",e=>{const b=e.target.closest&&e.target.closest(".big");if(b)b.style.transform=""});
home();
</script></body></html>
